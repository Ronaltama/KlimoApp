name: Build Android Release (CI/CD)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      commit_to_repo:
        description: 'Commit file APK hasil build ke folder release/ di repo?'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: |
          cd FlutterApps
          flutter pub get

      - name: 🤖 Build Android APK (Release Mode)
        run: |
          cd FlutterApps
          flutter build apk --release

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlimoApp-Android-Release
          path: FlutterApps/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 💾 Copy to release/ & Commit to Repository
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_to_repo || startsWith(github.ref, 'refs/tags/') }}
        run: |
          mkdir -p release
          cp FlutterApps/build/app/outputs/flutter-apk/app-release.apk release/KlimoApp-release.apk
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add release/KlimoApp-release.apk
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build(android): update KlimoApp-release.apk via CI/CD [skip ci]"
            git push origin main
          fi
